name: ci
on:
  push: { branches: [main] }
  pull_request:

# Block style: a ${{ }} expression inside a { } flow mapping is invalid YAML.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGHOST: localhost
      PGPASSWORD: postgres
    defaults:
      run: { working-directory: apps/api }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: apps/api/constraints.txt }
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      # The tested versions (constraints.txt), so the OpenAPI check below sees what the images run.
      - run: pip install -c constraints.txt -e ".[dev]"
      - name: Security, engine, workflow and worker tests
        run: pytest -q
      - name: OpenAPI contract is up to date
        run: |
          python -c "import json; from kritvia_api.main import app; print(json.dumps(app.openapi(), indent=2, sort_keys=True))" > /tmp/openapi.json
          diff -u ../../packages/shared-types/openapi.json /tmp/openapi.json

  audit:
    # Known-vulnerable dependencies and shell-script mistakes fail the build (round 3, C7 and B3).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pip install pip-audit==2.10.1 shellcheck_py-0.11.0.1-*.whl
      - name: Python dependencies (API, browser, app runner)
        run: |
          pip-audit --disable-pip --no-deps -r apps/api/constraints.txt
          pip-audit --disable-pip --no-deps -r services/browser/requirements.txt
          pip-audit --disable-pip --no-deps -r services/mcp-runner/requirements.txt
      - name: Node dependencies used in production
        run: pnpm audit --prod --audit-level high
      - name: Shell scripts
        run: shellcheck -S warning infra/scripts/*.sh scripts/*.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Generated TS types match the OpenAPI schema
        run: |
          cd packages/shared-types && npx openapi-typescript openapi.json -o /tmp/api.d.ts && diff -u src/api.d.ts /tmp/api.d.ts
      - run: pnpm --filter @kritvia/web lint
      - run: pnpm --filter @kritvia/web typecheck
      - run: pnpm --filter @kritvia/web test
      - run: pnpm --filter @kritvia/web build

  browser:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: services/browser }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pytest==9.1.1 pytest-asyncio==1.4.0 httpx==0.28.1
      - run: python -m playwright install --with-deps --only-shell chromium
      - name: Browser guard and service tests (read-only sessions, approved submits, private addresses)
        run: python -m pytest -q tests

  images:
    runs-on: ubuntu-latest
    needs: [api, web, browser]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build all images (the VM builds its own arm64 images on deploy)
        run: |
          docker build -f apps/api/Dockerfile -t kritvia-api .
          docker build -f apps/worker/Dockerfile -t kritvia-worker .
          docker build -f apps/web/Dockerfile -t kritvia-web .
          docker build -f services/sandbox/runner/Dockerfile -t kritvia-sandbox services/sandbox
          docker build -f services/sandbox/jobs/Dockerfile -t kritvia-sandbox-jobs services/sandbox
          docker build -t kritvia-browser services/browser
      - name: Sandboxed job cannot reach the network
        run: |
          out=$(echo '{}' | docker run --rm -i --network=none --read-only --cap-drop=ALL --user 65534:65534 \
                kritvia-sandbox-jobs python -I -m kritvia_jobs net_probe)
          echo "$out"; echo "$out" | grep -q '"network":false'
