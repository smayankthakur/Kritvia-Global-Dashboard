; Copy this file to kritvia_tally_sync.ini (next to kritvia_tally_sync.py) and fill it in.
; Kritvia shows the address and the key once, on Money > Tally > Make a sync key. Keep the key private.

[kritvia]
hook_url = https://api.sitelytc.com/hooks/tally/00000000-0000-0000-0000-000000000000
sync_key = kts_paste-the-key-here

[tally]
; Tally's own XML server on this PC (F1 Help > Settings > Connectivity)
url = http://localhost:9000
; how many days of the Day Book to send each time
days = 7
; the company's name exactly as in Tally, when more than one company is open (optional)
company =
