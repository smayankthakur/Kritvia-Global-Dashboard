# Kritvia capability tiers. Order = fallback order.
#
# data_policy per deployment:
#   local        runs on our VM or the client's VPC; data never leaves
#   byok_client  the client's own key/account (their contract, their terms)
#   no_training  hosted, provider contractually does not train on inputs
#   may_train    free tier whose terms may allow training -> never in any tier (the Privacy Policy promises
#                that no provider trains on customer data; tests/test_tiers_policy.py enforces this)
#
# A request flagged sensitive may only reach deployments whose policy is listed
# in sensitive_allowed. This is enforced in code, not left to workflow authors.

sensitive_allowed: [local, byok_client]

deployments:
  # Groq: account-level Zero Data Retention must be ON (GroqCloud -> Data Controls); Groq does not train on API data.
  groq-llama-70b:   { data_policy: no_training }
  groq-llama-8b:    { data_policy: no_training }
  groq-whisper:     { data_policy: no_training }
  # Gemini: the key's Google Cloud project must have billing on (paid tier); the unpaid tier may train.
  gemini-flash:     { data_policy: no_training }
  # OpenRouter free models may log and train: declared, but kept out of every tier (customer data only flows here).
  openrouter-free:  { data_policy: may_train }
  ollama-qwen-7b:   { data_policy: local }
  ollama-bge-m3:    { data_policy: local }
  local-whisper:    { data_policy: local }
  # Sarvam (Indian languages, Hinglish), called natively by the API with SARVAM_API_KEY. Its standard terms allow
  # training on inputs, so it is out of the dictation chain. Re-add it (as no_training) only with a signed
  # no-training agreement, and update the sub-processor list in the Privacy Policy first.
  sarvam-saaras:    { data_policy: may_train, provider: sarvam, model: "saaras:v4" }

tiers:
  fast:         [groq-llama-8b, ollama-qwen-7b]
  extract:      [groq-llama-70b, ollama-qwen-7b]
  reason:       [groq-llama-70b, gemini-flash, ollama-qwen-7b]
  long_context: [gemini-flash, groq-llama-70b]
  private:      [ollama-qwen-7b]
  embed:        [ollama-bge-m3]
  # Long recordings (meetings). Sarvam's REST API takes short clips only, so it is not in this chain.
  speech:       [groq-whisper, local-whisper]
  # Dictation (voice input, desktop widget): short clips.
  dictation:    [groq-whisper, local-whisper]
