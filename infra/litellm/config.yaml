# LiteLLM proxy — model deployments. Kritvia never names these in workflow code;
# workflows ask for a tier and tiers.yaml maps tiers -> ordered deployments.
#
# VERIFY BEFORE USE: provider model IDs and free-tier limits change often.
model_list:
  # --- Groq (free tier, hosted). Deployment names are stable aliases used by tiers.yaml;
  # the model behind each changes as Groq retires models (Llama 3.x went in 2026).
  # Check what the key can use: curl https://api.groq.com/openai/v1/models -H "Authorization: Bearer $GROQ_API_KEY"
  - model_name: groq-llama-70b        # "large" slot
    litellm_params: { model: groq/openai/gpt-oss-120b, api_key: os.environ/GROQ_API_KEY }
  - model_name: groq-llama-8b         # "small, fast" slot
    litellm_params: { model: groq/openai/gpt-oss-20b, api_key: os.environ/GROQ_API_KEY }
  - model_name: groq-whisper
    litellm_params: { model: groq/whisper-large-v3, api_key: os.environ/GROQ_API_KEY }

  # --- Cerebras (free tier, no retention). Check models: curl https://api.cerebras.ai/v1/models -H "Authorization: Bearer $CEREBRAS_API_KEY"
  - model_name: cerebras-large
    litellm_params: { model: cerebras/gpt-oss-120b, api_key: os.environ/CEREBRAS_API_KEY }
  - model_name: cerebras-qwen
    litellm_params: { model: cerebras/qwen-3-235b-a22b-instruct-2507, api_key: os.environ/CEREBRAS_API_KEY }

  # --- Cloudflare Workers AI (free daily allocation, no training). Needs the account id too.
  - model_name: cloudflare-llama-70b
    litellm_params: { model: cloudflare/@cf/meta/llama-3.3-70b-instruct-fp8-fast, api_key: os.environ/CLOUDFLARE_API_KEY,
                      account_id: os.environ/CLOUDFLARE_ACCOUNT_ID }

  # --- Free tiers whose providers may train on inputs: only for organisations that opt in ---
  - model_name: gemini-flash
    litellm_params: { model: gemini/gemini-3.5-flash, api_key: os.environ/GEMINI_API_KEY }
  - model_name: mistral-large
    litellm_params: { model: mistral/mistral-large-latest, api_key: os.environ/MISTRAL_API_KEY }
  - model_name: openrouter-free
    litellm_params: { model: openrouter/qwen/qwen3.8-27b:free, api_key: os.environ/OPENROUTER_API_KEY }
  - model_name: openrouter-big        # 1M context, for long documents
    litellm_params: { model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free, api_key: os.environ/OPENROUTER_API_KEY }

  # --- Local Ollama on the VM (the only 'private' destination at MVP) ---
  - model_name: ollama-qwen-7b
    litellm_params: { model: ollama_chat/qwen2.5:7b-instruct, api_base: os.environ/OLLAMA_BASE_URL }
  - model_name: local-whisper   # faster-whisper server on the VM (OpenAI-compatible)
    litellm_params: { model: openai/Systran/faster-whisper-small, api_base: os.environ/WHISPER_BASE_URL, api_key: "none" }
    model_info: { mode: audio_transcription }
  - model_name: ollama-bge-m3
    litellm_params: { model: ollama/bge-m3, api_base: os.environ/OLLAMA_BASE_URL }

litellm_settings:
  num_retries: 0          # Kritvia's router owns retry/fallback so every attempt is metered
  request_timeout: 120
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
