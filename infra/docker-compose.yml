# Kritvia stack — the same file runs on the Oracle Always Free ARM VM and, later,
# inside a client's VPC. Images publish linux/arm64 builds (verify tags when upgrading).
# Nothing is exposed publicly: web and API bind to 127.0.0.1 and are published
# through Cloudflare Tunnel (profile "tunnel") or a reverse proxy you run.
#
#   cp ../.env.example ../.env   # fill in secrets
#   docker compose build sandbox-jobs && docker compose up -d
#   docker compose --profile tunnel --profile speech up -d   # optional extras
name: kritvia

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://kritvia_app:${KRITVIA_APP_PASSWORD}@postgres:5432/kritvia
  REDIS_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
  DISPATCH_MODE: arq
  LITELLM_BASE_URL: http://litellm:4000
  TIERS_CONFIG_PATH: /app/tiers.yaml
  SANDBOX_URL: http://sandbox:8100
  BROWSER_URL: http://browser:8200
  MCP_RUNNER_URL: ${MCP_RUNNER_URL:-}
  MCP_RUNNER_TOKEN: ${MCP_RUNNER_TOKEN:-}

# Container logs rotate on disk; scripts/archive-logs.sh keeps a daily copy for one year (CERT-In: 180 days in India;
# DPDP Rules 2025 r.6: one year). Rotation only bounds disk use between archives.
x-logging: &logging
  driver: json-file
  options: { max-size: "50m", max-file: "4" }

services:
  postgres:
    logging: *logging
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: kritvia
      KRITVIA_OWNER_PASSWORD: ${KRITVIA_OWNER_PASSWORD:?set in .env}
      KRITVIA_APP_PASSWORD: ${KRITVIA_APP_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/00-roles.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "max_connections=100", "-c", "log_min_duration_statement=2000"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kritvia"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    logging: *logging
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--requirepass", "${VALKEY_PASSWORD:?set in .env}"]
    volumes:
      - valkeydata:/data

  ollama:
    logging: *logging
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollamadata:/root/.ollama
    # First run: docker compose exec ollama ollama pull qwen2.5:7b-instruct && docker compose exec ollama ollama pull bge-m3

  litellm:
    logging: *logging
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    # Only what LiteLLM needs: never the app's secrets (JWT, master key, database owner, billing).
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      CLOUDFLARE_API_KEY: ${CLOUDFLARE_API_KEY:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OLLAMA_BASE_URL: http://ollama:11434
      WHISPER_BASE_URL: http://whisper:8000/v1
      LITELLM_TELEMETRY: "False"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    depends_on: [ollama]

  migrate:
    logging: *logging
    build: { context: .., dockerfile: apps/api/Dockerfile }
    command: ["python", "-m", "kritvia_api.db.migrate"]
    environment:
      MIGRATION_DATABASE_URL: postgresql://kritvia_owner:${KRITVIA_OWNER_PASSWORD}@postgres:5432/kritvia
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    logging: *logging
    build: { context: .., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    env_file: ../.env
    environment: *app-env
    networks: [default, browsing]
    volumes:
      - ./litellm/tiers.yaml:/app/tiers.yaml:ro
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }
      litellm: { condition: service_started }
      valkey: { condition: service_started }

  worker:
    logging: *logging
    build: { context: .., dockerfile: apps/worker/Dockerfile }
    restart: unless-stopped
    env_file: ../.env
    environment: *app-env
    networks: [default, browsing]
    volumes:
      - ./litellm/tiers.yaml:/app/tiers.yaml:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_started }

  # Reserved worker for priority processing (Scale and Enterprise runs; engine/dispatch.py).
  worker-priority:
    logging: *logging
    build: { context: .., dockerfile: apps/worker/Dockerfile }
    command: ["arq", "kritvia_worker.main.PriorityWorkerSettings"]
    restart: unless-stopped
    env_file: ../.env
    environment: *app-env
    networks: [default, browsing]
    volumes:
      - ./litellm/tiers.yaml:/app/tiers.yaml:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_started }

  web:
    logging: *logging
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:   # from the .env file; shown in the site footer
        NEXT_PUBLIC_COMPANY_ADDRESS: ${NEXT_PUBLIC_COMPANY_ADDRESS:-}
        NEXT_PUBLIC_COMPANY_GSTIN: ${NEXT_PUBLIC_COMPANY_GSTIN:-}
    restart: unless-stopped
    environment:
      KRITVIA_API_URL: http://api:8000
      NODE_ENV: production
      STATUS_DIR: /status
    # Public incident history written by infra/scripts/healthcheck.sh, shown on /status.
    volumes: ["/var/lib/kritvia/status:/status:ro"]
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]

  # The ONLY service with the Docker socket. Internal network only, token-authenticated.
  sandbox:
    logging: *logging
    build: { context: ../services/sandbox, dockerfile: runner/Dockerfile }
    restart: unless-stopped
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?set in .env}
      SANDBOX_IMAGE: kritvia-sandbox-jobs:latest
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-runsc}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8100"]

  # Build-only: produces the image the sandbox runs jobs in (no network at runtime).
  sandbox-jobs:
    logging: *logging
    build: { context: ../services/sandbox, dockerfile: jobs/Dockerfile }
    image: kritvia-sandbox-jobs:latest
    entrypoint: ["true"]
    restart: "no"
    network_mode: none

  # Local speech-to-text for sensitive audio (tier 'speech' falls back to it), and Kritvia's own voice for
  # phone calls (Kokoro/Piper; set VOICE_LOCAL_URL=http://whisper:8000/v1). Verify the arm64 tag before use.
  whisper:
    logging: *logging
    profiles: ["speech"]
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    restart: unless-stopped
    volumes:
      - whispercache:/home/ubuntu/.cache/huggingface

  # Speaker separation for meeting recordings (set DIARIZATION_URL=http://diarization:8200).
  diarization:
    logging: *logging
    profiles: ["speech"]
    build: { context: ../services/diarization }
    restart: unless-stopped
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      DIARIZATION_TOKEN: ${DIARIZATION_TOKEN:-}
    volumes:
      - hfcache:/home/diar/.cache

  # Headless Chromium for the browser agent (services/browser; one job at a time, read-only unless a person
  # approved a form). Its own network: the internet through its egress guard, and nothing internal except
  # the API and workers that call it (no database, cache or model gateway). BROWSER_TOKEN empty = off.
  # Once gVisor is installed (see services/sandbox/README.md), set BROWSER_RUNTIME=runsc in .env.
  browser:
    logging: *logging
    build: { context: ../services/browser }
    restart: unless-stopped
    runtime: ${BROWSER_RUNTIME:-runc}
    environment:
      BROWSER_TOKEN: ${BROWSER_TOKEN:-}
      HOME: /home/browser
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
      - /home/browser:rw,nosuid,nodev,size=64m,uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: 1.5
    pids_limit: 256
    networks: [browsing]

  # App store: hosts MCP servers from npm / PyPI / container images that Kritvia's team approved, one gVisor
  # container per installed app (services/mcp-runner). The app containers sit on the internal mcp-sandbox
  # network and reach the internet only through this runner's egress proxy, with only their approved sites.
  # Off until set in .env: MCP_RUNNER_URL=http://mcp-runner:8300 and MCP_RUNNER_TOKEN (and gVisor installed);
  # deploy.sh then builds and starts it.
  mcp-runner:
    logging: *logging
    profiles: ["apps"]
    build: { context: ../services/mcp-runner }
    restart: unless-stopped
    environment:
      MCP_RUNNER_TOKEN: ${MCP_RUNNER_TOKEN:-}
      MCP_RUNTIME: ${MCP_RUNTIME:-runsc}
      MCP_NETWORK: kritvia_mcp-sandbox
      MCP_PROXY_HOST: mcp-runner
      MCP_MAX_INSTANCES: ${MCP_MAX_INSTANCES:-4}     # each app may use up to 768 MB
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 512m
    networks: [default, mcp-sandbox]

  cloudflared:
    logging: *logging
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN:-}"]
    depends_on: [web, api]

networks:
  default: {}
  browsing: {}
  # No route out: hosted apps reach the internet only through the MCP runner's egress proxy.
  mcp-sandbox:
    name: kritvia_mcp-sandbox
    internal: true

volumes:
  pgdata:
  valkeydata:
  ollamadata:
  whispercache:
  hfcache:
