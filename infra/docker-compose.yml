# Kritvia stack — the same file runs on the Oracle Always Free ARM VM and, later,
# inside a client's VPC. Images publish linux/arm64 builds (verify tags when upgrading).
# Nothing is exposed publicly: web and API bind to 127.0.0.1 and are published
# through Cloudflare Tunnel (profile "tunnel") or a reverse proxy you run.
#
#   cp ../.env.example ../.env   # fill in secrets
#   docker compose build sandbox-jobs && docker compose up -d
#   docker compose --profile tunnel --profile speech up -d   # optional extras
name: kritvia

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://kritvia_app:${KRITVIA_APP_PASSWORD}@postgres:5432/kritvia
  REDIS_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
  DISPATCH_MODE: arq
  LITELLM_BASE_URL: http://litellm:4000
  TIERS_CONFIG_PATH: /app/tiers.yaml
  SANDBOX_URL: http://sandbox:8100
  BROWSER_URL: http://browser:8200
  MCP_RUNNER_URL: ${MCP_RUNNER_URL:-}
  MCP_RUNNER_TOKEN: ${MCP_RUNNER_TOKEN:-}

# Container logs rotate on disk; scripts/archive-logs.sh copies them every hour (and before each deploy) and
# keeps the copies for one year (CERT-In: 180 days in India; DPDP Rules 2025 r.6: one year). Rotation only
# bounds disk use between archives, with room for a busy hour.
x-logging: &logging
  driver: json-file
  options: { max-size: "100m", max-file: "5" }

services:
  postgres:
    logging: *logging
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: kritvia
      KRITVIA_OWNER_PASSWORD: ${KRITVIA_OWNER_PASSWORD:?set in .env}
      KRITVIA_APP_PASSWORD: ${KRITVIA_APP_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/00-roles.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro
    # Slow statements are logged without their values (names, phone numbers, encrypted blobs stay out of the logs).
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "max_connections=100", "-c", "log_min_duration_statement=2000",
              "-c", "log_parameter_max_length=0", "-c", "log_parameter_max_length_on_error=0"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kritvia"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    logging: *logging
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--requirepass", "${VALKEY_PASSWORD:?set in .env}"]
    volumes:
      - valkeydata:/data

  ollama:
    logging: *logging
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollamadata:/root/.ollama
    # First run: docker compose exec ollama ollama pull qwen2.5:7b-instruct && docker compose exec ollama ollama pull bge-m3

  litellm:
    logging: *logging
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    # Only what LiteLLM needs: never the app's secrets (JWT, master key, database owner, billing).
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      CLOUDFLARE_API_KEY: ${CLOUDFLARE_API_KEY:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OLLAMA_BASE_URL: http://ollama:11434
      WHISPER_BASE_URL: http://whisper:8000/v1
      LITELLM_TELEMETRY: "False"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    depends_on: [ollama]

  migrate:
    logging: *logging
    build: { context: .., dockerfile: apps/api/Dockerfile }
    command: ["python", "-m", "kritvia_api.db.migrate"]
    environment:
      MIGRATION_DATABASE_URL: postgresql://kritvia_owner:${KRITVIA_OWNER_PASSWORD}@postgres:5432/kritvia
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    logging: *logging
    build: { context: .., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    env_file: ../.env
    environment: *app-env
    networks: [default]
    volumes:
      - ./litellm/tiers.yaml:/app/tiers.yaml:ro
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }
      litellm: { condition: service_started }
      valkey: { condition: service_started }

  worker:
    logging: *logging
    build: { context: .., dockerfile: apps/worker/Dockerfile }
    restart: unless-stopped
    env_file: ../.env
    environment: *app-env
    networks: [default]
    volumes:
      - ./litellm/tiers.yaml:/app/tiers.yaml:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_started }

  # Reserved worker for priority processing (Scale and Enterprise runs; engine/dispatch.py).
  worker-priority:
    logging: *logging
    build: { context: .., dockerfile: apps/worker/Dockerfile }
    command: ["arq", "kritvia_worker.main.PriorityWorkerSettings"]
    restart: unless-stopped
    env_file: ../.env
    environment: *app-env
    networks: [default]
    volumes:
      - ./litellm/tiers.yaml:/app/tiers.yaml:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_started }

  web:
    logging: *logging
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:   # from the .env file; shown in the site footer
        NEXT_PUBLIC_COMPANY_ADDRESS: ${NEXT_PUBLIC_COMPANY_ADDRESS:-}
        NEXT_PUBLIC_COMPANY_GSTIN: ${NEXT_PUBLIC_COMPANY_GSTIN:-}
    restart: unless-stopped
    environment:
      KRITVIA_API_URL: http://api:8000
      NODE_ENV: production
      STATUS_DIR: /status
    # Public incident history written by infra/scripts/healthcheck.sh, shown on /status.
    volumes: ["/var/lib/kritvia/status:/status:ro"]
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]

  # The ONLY service with the Docker socket. Internal network only, token-authenticated.
  sandbox:
    logging: *logging
    build: { context: ../services/sandbox, dockerfile: runner/Dockerfile }
    restart: unless-stopped
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?set in .env}
      SANDBOX_IMAGE: kritvia-sandbox-jobs:latest
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-runsc}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8100"]

  # Build-only: produces the image the sandbox runs jobs in (no network at runtime).
  sandbox-jobs:
    logging: *logging
    build: { context: ../services/sandbox, dockerfile: jobs/Dockerfile }
    image: kritvia-sandbox-jobs:latest
    entrypoint: ["true"]
    restart: "no"
    network_mode: none

  # Local speech-to-text for sensitive audio (tier 'speech' falls back to it), and Kritvia's own voice for
  # phone calls (Kokoro/Piper; set VOICE_LOCAL_URL=http://whisper:8000/v1). Verify the arm64 tag before use.
  whisper:
    logging: *logging
    profiles: ["speech"]
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    restart: unless-stopped
    volumes:
      - whispercache:/home/ubuntu/.cache/huggingface

  # Speaker separation for meeting recordings (set DIARIZATION_URL=http://diarization:8200).
  diarization:
    logging: *logging
    profiles: ["speech"]
    build: { context: ../services/diarization }
    restart: unless-stopped
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      DIARIZATION_TOKEN: ${DIARIZATION_TOKEN:-}
    volumes:
      - hfcache:/home/diar/.cache

  # Headless Chromium for the browser agent (services/browser; one job at a time, read-only unless a person
  # approved a form). Three small containers (test report S5), all from the same image, all off unless .env has
  # BROWSER_TOKEN and BROWSER_RUNTIME=runsc (deploy.sh adds the "browser" profile only then):
  #   browser-chromium  Chromium itself, under gVisor, on an internal network with no route anywhere
  #   browser-egress    the only way out: CONNECT with the shared token to public addresses it checks itself
  #   browser           a plain door from the stack's network to browser-chromium:8200 (BROWSER_URL stays the
  #                     same); the API, workers, database and cache are never on Chromium's network
  browser-chromium:
    logging: *logging
    profiles: ["browser"]
    build: { context: ../services/browser }
    restart: unless-stopped
    runtime: ${BROWSER_RUNTIME:-runsc}
    environment:
      BROWSER_TOKEN: ${BROWSER_TOKEN:-}
      BROWSER_RUNTIME: ${BROWSER_RUNTIME:-runsc}
      BROWSER_CHROMIUM_SANDBOX: "1"
      BROWSER_EGRESS: browser-egress:8401
      BROWSER_EGRESS_TOKEN: ${BROWSER_TOKEN:-}
      HOME: /home/browser
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
      - /home/browser:rw,nosuid,nodev,size=64m,uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: 1.5
    pids_limit: 256
    networks: [browser-internal]

  browser-egress:
    logging: *logging
    profiles: ["browser"]
    build: { context: ../services/browser }
    command: ["python", "guard.py", "egress", "8401"]
    restart: unless-stopped
    environment:
      BROWSER_EGRESS_TOKEN: ${BROWSER_TOKEN:-}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8401), 3).close()"]
      interval: 60s
      timeout: 5s
      retries: 3
    networks: [browser-internal, browser-out]

  browser:
    logging: *logging
    profiles: ["browser"]
    build: { context: ../services/browser }
    command: ["python", "guard.py", "relay", "8200", "browser-chromium", "8200"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/healthz')"]
      interval: 60s
      timeout: 5s
      retries: 3
    networks: [default, browser-internal]

  # App store: hosts MCP servers from npm / PyPI / container images that Kritvia's team approved, one gVisor
  # container per installed app (services/mcp-runner). The app containers sit on the internal mcp-sandbox
  # network and reach the internet only through this runner's egress proxy, with only their approved sites.
  # Off until set in .env: MCP_RUNNER_URL=http://mcp-runner:8300 and MCP_RUNNER_TOKEN (and gVisor installed);
  # deploy.sh then builds and starts it.
  mcp-runner:
    logging: *logging
    profiles: ["apps"]
    build: { context: ../services/mcp-runner }
    restart: unless-stopped
    environment:
      MCP_RUNNER_TOKEN: ${MCP_RUNNER_TOKEN:-}
      MCP_RUNTIME: ${MCP_RUNTIME:-runsc}
      MCP_NETWORK: kritvia_mcp-sandbox
      MCP_PROXY_HOST: mcp-runner
      MCP_MAX_INSTANCES: ${MCP_MAX_INSTANCES:-4}     # each app may use up to 768 MB
      DOCKER_HOST: tcp://mcp-docker:2375             # Docker only through the limited socket proxy (S7)
    mem_limit: 512m
    depends_on: [mcp-docker]
    # Each app also gets a network of its own, shared only with this runner (services/mcp-runner/app.py); the
    # control API on 8300 refuses requests that arrive over any of those networks.
    networks: [default, mcp-sandbox, mcp-control]

  # The Docker API for the MCP runner, limited to containers, networks and images (no exec, volumes, builds,
  # swarm or system calls); the runner itself no longer holds the Docker socket. Pinned by digest.
  mcp-docker:
    logging: *logging
    profiles: ["apps"]
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      IMAGES: 1
      POST: 1
      EXEC: 0
      VOLUMES: 0
      BUILD: 0
      SWARM: 0
      SYSTEM: 0
      SERVICES: 0
      TASKS: 0
      SECRETS: 0
      CONFIGS: 0
      PLUGINS: 0
      NODES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 128m
    networks: [mcp-control]

  cloudflared:
    logging: *logging
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN:-}"]
    depends_on: [web, api]

networks:
  default: {}
  # Chromium's network: no route out, nothing internal on it (S5). browser-out is the egress guard's way out.
  browser-internal:
    internal: true
  browser-out: {}
  # The MCP runner and its Docker socket proxy only.
  mcp-control:
    internal: true
  # No route out: hosted apps reach the internet only through the MCP runner's egress proxy.
  mcp-sandbox:
    name: kritvia_mcp-sandbox
    internal: true

volumes:
  pgdata:
  valkeydata:
  ollamadata:
  whispercache:
  hfcache:
